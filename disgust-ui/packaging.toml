# Only application-specific data; implementation is shared across all clients.
schema_version = 1

[app]
name = "Disgust UI"
version = "1.0.0"
main_class = "disgust.ui.Main"

[build]
mode = "distribution"
tasks = [":disgust-ui:installDist"]
jar = "build/install/disgust-ui/lib/disgust-ui-*.jar"

[javafx]
version = "25.0.1"

[runtime]
modules = ["javafx.controls", "java.sql", "jdk.zipfs", "java.logging", "java.xml", "jdk.charsets"]
exclude_natives = ["jfxwebkit.dll"]

[windows]
upgrade_uuid = "422e4893-c1e8-5f7d-a98a-8218bec17a60"
per_user = true

[linux]
package_name = "disgust-ui"
menu_group = "Office"
